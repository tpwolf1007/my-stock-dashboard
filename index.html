<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>個人股市儀表板 (RWD 手機完美適配版)</title>
    <script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        /* 基礎樣式 (適用於電腦版) */
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 20px; background-color: #f8f9fa; color: #333; }
        .container { max-width: 1000px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding-bottom: 15px; margin-bottom: 20px; }
        .search-bar { display: flex; gap: 10px; }
        input[type="text"] { padding: 8px; border: 1px solid #ccc; border-radius: 5px; font-size: 16px; }
        button { padding: 8px 15px; background-color: #1a73e8; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; transition: background-color 0.2s; white-space: nowrap; }
        button:hover { background-color: #1557b0; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
        
        .watchlist { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .watch-item { padding: 6px 16px; background: #e8f0fe; color: #1a73e8; border-radius: 20px; cursor: pointer; border: 1px solid transparent; font-weight: 500; }
        .watch-item.active { background: #1a73e8; color: white; }
        
        .stock-info { display: flex; flex-direction: column; gap: 5px; margin-bottom: 15px; }
        .stock-title { font-size: 24px; font-weight: bold; }
        .stock-price { font-size: 36px; font-weight: bold; }
        .stock-change { font-size: 18px; font-weight: 500; }
        
        .controls-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid #ddd; padding-bottom: 10px;}
        .range-selector { display: flex; gap: 0; }
        .range-btn { background: transparent; color: #5f6368; border: none; border-bottom: 3px solid transparent; border-radius: 0; padding: 10px 15px; font-size: 14px; font-weight: bold; cursor: pointer; }
        .range-btn:hover { background: #f1f3f4; }
        .range-btn.active { color: #1a73e8; border-bottom-color: #1a73e8; }
        
        .chart-toggles { display: flex; gap: 15px; font-size: 15px; font-weight: 500;}
        .chart-toggles label { cursor: pointer; display: flex; align-items: center; gap: 5px; color: #333; user-select: none; }
        .chart-toggles input[type="checkbox"] { width: 16px; height: 16px; cursor: pointer; }

        .chart-container { width: 100%; height: 500px; margin-bottom: 20px; position: relative; border: 1px solid #eee; border-radius: 5px; overflow: hidden; }
        
        .grid-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; border-top: 1px solid #eee; padding-top: 20px; }
        .stat-item { display: flex; flex-direction: column; }
        .stat-label { color: #5f6368; font-size: 14px; margin-bottom: 4px; }
        .stat-value { font-size: 16px; font-weight: bold; }
        #statusMsg { font-weight: bold; margin-bottom: 10px; }
        .loading { color: #f29900; }
        .error { color: #ea4335; }

        /* =========================================
           ★ RWD 響應式設計 (專為手機與小螢幕設計)
           ========================================= */
        @media (max-width: 768px) {
            body { padding: 10px; }
            .container { padding: 15px; }
            
            /* 標題與搜尋框改為上下排列，並讓搜尋框滿版 */
            .header { flex-direction: column; align-items: flex-start; gap: 15px; }
            .search-bar { width: 100%; }
            .search-bar input { flex-grow: 1; }
            
            .stock-price { font-size: 30px; }
            
            /* 控制列上下排列，確保不會因為螢幕太窄而重疊 */
            .controls-row { flex-direction: column; align-items: flex-start; gap: 15px; }
            
            /* 時間區間按鈕改為可以橫向滑動，隱藏滾動條 */
            .range-selector { width: 100%; overflow-x: auto; white-space: nowrap; padding-bottom: 2px; }
            .range-selector::-webkit-scrollbar { display: none; } /* 隱藏捲軸讓畫面乾淨 */
            
            /* 圖表開關等距排列 */
            .chart-toggles { width: 100%; justify-content: flex-start; flex-wrap: wrap; gap: 10px; font-size: 14px; }
            
            /* 手機上自動縮小圖表高度，讓畫面更有呼吸空間 */
            .chart-container { height: 350px; }
            
            /* 詳細數據從橫向 4 格變成 2x2 矩陣排列 */
            .grid-stats { grid-template-columns: repeat(2, 1fr); gap: 15px 10px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>我的股市儀表板</h2>
        <div class="search-bar">
            <input type="text" id="stockInput" placeholder="輸入代號 (例: 2330)">
            <button id="addBtn" onclick="addStock()">新增</button>
        </div>
    </div>
    
    <div id="statusMsg"></div>
    <div class="watchlist" id="watchlistContainer"></div>

    <div class="stock-info">
        <div class="stock-title" id="stockName">載入中...</div>
        <div style="display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;">
            <div class="stock-price" id="currentPrice">--</div>
            <div class="stock-change" id="priceChange">--</div>
        </div>
    </div>

    <div class="controls-row">
        <div class="range-selector" id="rangeContainer">
            <button class="range-btn" onclick="setRange('1d')">1 天</button>
            <button class="range-btn" onclick="setRange('5d')">5 天</button>
            <button class="range-btn active" onclick="setRange('1mo')">1 個月</button>
            <button class="range-btn" onclick="setRange('6mo')">6 個月</button>
            <button class="range-btn" onclick="setRange('ytd')">今年迄今</button>
            <button class="range-btn" onclick="setRange('1y')">1 年</button>
        </div>
        
        <div class="chart-toggles">
            <label><input type="checkbox" id="toggleLine" checked onchange="updateSeriesVisibility()"> 折線</label>
            <label><input type="checkbox" id="toggleCandle" checked onchange="updateSeriesVisibility()"> K線</label>
            <label><input type="checkbox" id="toggleVolume" checked onchange="updateSeriesVisibility()"> 成交量</label>
        </div>
    </div>

    <div id="stockChart" class="chart-container"></div>

    <div class="grid-stats">
        <div class="stat-item"><span class="stat-label">開盤價</span><span class="stat-value" id="openPrice">--</span></div>
        <div class="stat-item"><span class="stat-label">最高價</span><span class="stat-value" id="highPrice">--</span></div>
        <div class="stat-item"><span class="stat-label">最低價</span><span class="stat-value" id="lowPrice">--</span></div>
        <div class="stat-item"><span class="stat-label">當前成交量</span><span class="stat-value" id="volume">--</span></div>
    </div>
</div>

<script>
    let watchlist = ['0050', '2330', '00981A'];
    let currentStock = '0050';
    let currentRange = '1mo';
    
    let chartInstance = null; 
    let lineSeries = null;    
    let candleSeries = null;  
    let volumeSeries = null;  

    const rangeConfig = {
        '1d': { interval: '5m' },
        '5d': { interval: '15m' },
        '1mo': { interval: '1d' },
        '6mo': { interval: '1d' },
        'ytd': { interval: '1d' },
        '1y': { interval: '1wk' }
    };

    async function init() {
        renderWatchlist();
        initChart(); 
        await loadData();
    }

    function initChart() {
        const chartContainer = document.getElementById('stockChart');
        chartInstance = LightweightCharts.createChart(chartContainer, {
            autoSize: true, // 這行非常強大，它會隨時偵測容器大小變化並自動重繪圖表
            layout: { textColor: '#333', background: { type: 'solid', color: '#ffffff' } },
            grid: { vertLines: { color: '#f0f0f0' }, horzLines: { color: '#f0f0f0' } },
            crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
            rightPriceScale: { borderColor: '#cccccc' },
            localization: {
                timeFormatter: (time) => {
                    if (typeof time === 'number') {
                        const d = new Date((time + 28800) * 1000); 
                        const y = d.getUTCFullYear();
                        const m = String(d.getUTCMonth() + 1).padStart(2, '0');
                        const day = String(d.getUTCDate()).padStart(2, '0');
                        const h = String(d.getUTCHours()).padStart(2, '0');
                        const min = String(d.getUTCMinutes()).padStart(2, '0');
                        return `${y}/${m}/${day} ${h}:${min}`;
                    } else if (typeof time === 'string') {
                        return time.replace(/-/g, '/');
                    }
                    return time;
                }
            },
            timeScale: { 
                borderColor: '#cccccc', 
                timeVisible: true,
                tickMarkFormatter: (time, tickMarkType, locale) => {
                    if (typeof time === 'number') {
                        const d = new Date((time + 28800) * 1000); 
                        const m = String(d.getUTCMonth() + 1).padStart(2, '0');
                        const day = String(d.getUTCDate()).padStart(2, '0');
                        const h = String(d.getUTCHours()).padStart(2, '0');
                        const min = String(d.getUTCMinutes()).padStart(2, '0');
                        return `${m}/${day} ${h}:${min}`;
                    } else if (typeof time === 'string') {
                        return time.replace(/-/g, '/');
                    }
                    return time;
                }
            },
        });

        candleSeries = chartInstance.addCandlestickSeries({
            upColor: '#ea4335', downColor: '#137333', borderVisible: false,
            wickUpColor: '#ea4335', wickDownColor: '#137333',
        });

        lineSeries = chartInstance.addLineSeries({
            color: '#1a73e8', lineWidth: 2, crosshairMarkerVisible: true,
        });

        volumeSeries = chartInstance.addHistogramSeries({
            priceFormat: { type: 'volume' },
            priceScaleId: '', 
        });
        volumeSeries.priceScale().applyOptions({
            scaleMargins: { top: 0.8, bottom: 0 },
        });

        updateSeriesVisibility();
    }

    function updateSeriesVisibility() {
        const showLine = document.getElementById('toggleLine').checked;
        const showCandle = document.getElementById('toggleCandle').checked;
        const showVolume = document.getElementById('toggleVolume').checked;

        if (lineSeries) lineSeries.applyOptions({ visible: showLine });
        if (candleSeries) candleSeries.applyOptions({ visible: showCandle });
        if (volumeSeries) volumeSeries.applyOptions({ visible: showVolume });
    }

    function renderWatchlist() {
        const container = document.getElementById('watchlistContainer');
        container.innerHTML = '';
        watchlist.forEach(symbol => {
            const div = document.createElement('div');
            div.className = `watch-item ${symbol === currentStock ? 'active' : ''}`;
            div.textContent = symbol;
            div.onclick = () => { currentStock = symbol; renderWatchlist(); loadData(); };
            container.appendChild(div);
        });
    }

    function addStock() {
        const symbol = document.getElementById('stockInput').value.trim();
        if (symbol && !watchlist.includes(symbol)) {
            watchlist.push(symbol);
            currentStock = symbol;
            document.getElementById('stockInput').value = '';
            renderWatchlist();
            loadData();
        }
    }

    function setRange(range) {
        currentRange = range;
        document.querySelectorAll('.range-btn').forEach(btn => {
            btn.classList.remove('active');
            if (btn.getAttribute('onclick').includes(range)) btn.classList.add('active');
        });
        loadData();
    }

    async function fetchWithFallback(url) {
        const proxies = [
            `https://corsproxy.io/?url=${encodeURIComponent(url)}`,
            `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`
        ];
        for (let i = 0; i < proxies.length; i++) {
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 6000); 
                const response = await fetch(proxies[i], { signal: controller.signal });
                clearTimeout(timeoutId);
                if (response.ok) return await response.json();
            } catch (error) {
                console.warn(`代理伺服器 ${i+1} 失敗...`);
            }
        }
        throw new Error('代理伺服器全數忙碌中');
    }

    async function loadData() {
        setStatus('資料載入中...', 'loading');
        const config = rangeConfig[currentRange];
        
        try {
            const yahooUrl = `https://query1.finance.yahoo.com/v8/finance/chart/${currentStock}.TW?range=${currentRange}&interval=${config.interval}`;
            const data = await fetchWithFallback(yahooUrl);
            
            if (data.chart.error) throw new Error('API找不到該股票資料');
            
            const result = data.chart.result[0];
            const meta = result.meta;
            const quote = result.indicators.quote[0];
            
            const timestamps = result.timestamp || [];
            const opens = quote.open || [];
            const highs = quote.high || [];
            const lows = quote.low || [];
            const closes = quote.close || [];
            const volumes = quote.volume || [];
            
            let rawData = [];
            for (let i = 0; i < timestamps.length; i++) {
                if (opens[i] !== null && closes[i] !== null) {
                    rawData.push({
                        time: timestamps[i], 
                        open: opens[i], high: highs[i], low: lows[i], close: closes[i], 
                        volume: volumes[i] || 0
                    });
                }
            }
            rawData.sort((a, b) => a.time - b.time);

            let uniqueData = [];
            let lastTime = 0;
            for (let item of rawData) {
                if (item.time > lastTime) {
                    uniqueData.push(item);
                    lastTime = item.time;
                }
            }

            const kLineData = [];
            const lineData = [];
            const volData = [];
            
            for (let d of uniqueData) {
                let timeKey;
                if (currentRange === '1mo' || currentRange === '6mo' || currentRange === 'ytd' || currentRange === '1y') {
                    const dateObj = new Date((d.time + 28800) * 1000);
                    const y = dateObj.getUTCFullYear();
                    const m = String(dateObj.getUTCMonth() + 1).padStart(2, '0');
                    const day = String(dateObj.getUTCDate()).padStart(2, '0');
                    timeKey = `${y}-${m}-${day}`;
                } else {
                    timeKey = d.time; 
                }

                const isUp = d.close >= d.open;
                const volColor = isUp ? 'rgba(234, 67, 53, 0.6)' : 'rgba(19, 115, 51, 0.6)';

                kLineData.push({ time: timeKey, open: d.open, high: d.high, low: d.low, close: d.close });
                lineData.push({ time: timeKey, value: d.close }); 
                volData.push({ time: timeKey, value: d.volume, color: volColor });
            }

            candleSeries.setData(kLineData);
            lineSeries.setData(lineData);
            volumeSeries.setData(volData);
            
            chartInstance.timeScale().fitContent();

            const validClosePrices = kLineData.map(item => item.close);
            updateUI(meta, validClosePrices);
            setStatus('', '');

        } catch (error) {
            console.error("資料解析錯誤: ", error);
            setStatus(`資料載入失敗 (${error.message})，請確認網路連線或稍後再試。`, 'error');
        }
    }

    function updateUI(meta, validData) {
        document.getElementById('stockName').textContent = `${meta.symbol.replace('.TW', '')}`;
        
        const currentPrice = validData[validData.length - 1] || meta.regularMarketPrice;
        const basePrice = (currentRange === '1d') ? meta.previousClose : (validData[0] || meta.previousClose);
        
        const diff = currentPrice - basePrice;
        const percent = (diff / basePrice) * 100;
        
        const priceEl = document.getElementById('currentPrice');
        const changeEl = document.getElementById('priceChange');
        priceEl.textContent = currentPrice.toFixed(2);
        
        if (diff > 0) {
            priceEl.style.color = '#ea4335'; changeEl.style.color = '#ea4335';
            changeEl.textContent = `+${diff.toFixed(2)} (+${percent.toFixed(2)}%) ↑`;
        } else if (diff < 0) {
            priceEl.style.color = '#137333'; changeEl.style.color = '#137333';
            changeEl.textContent = `${diff.toFixed(2)} (${percent.toFixed(2)}%) ↓`;
        } else {
            priceEl.style.color = '#5f6368'; changeEl.style.color = '#5f6368';
            changeEl.textContent = `0.00 (0.00%) -`;
        }

        document.getElementById('openPrice').textContent = meta.regularMarketOpen ? meta.regularMarketOpen.toFixed(2) : '--';
        document.getElementById('highPrice').textContent = meta.regularMarketDayHigh ? meta.regularMarketDayHigh.toFixed(2) : '--';
        document.getElementById('lowPrice').textContent = meta.regularMarketDayLow ? meta.regularMarketDayLow.toFixed(2) : '--';
        const volume = meta.regularMarketVolume || 0;
        document.getElementById('volume').textContent = volume > 0 ? volume.toLocaleString() : '--';
    }

    function setStatus(msg, statusClass) {
        const el = document.getElementById('statusMsg');
        el.textContent = msg;
        el.className = statusClass;
    }

    // 當視窗大小改變時，圖表會自動透過 autoSize: true 適應，但為求穩健加入防抖重新排版
    window.addEventListener('resize', () => {
        if(chartInstance) {
            chartInstance.timeScale().fitContent();
        }
    });

    window.onload = init;
</script>

</body>
</html>
